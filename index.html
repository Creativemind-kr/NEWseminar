<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBS 아카데미 특강 캘린더</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --p:       #1B73E8;
      --p-dark:  #1557B0;
      --p-light: #E8F0FE;
      --green:   #1E8E3E;
      --amber:   #F9AB00;
      --red:     #D93025;
      --t1: #202124; --t2: #3C4043; --t3: #5F6368; --t4: #9AA0A6;
      --b1: #E8EAED; --b2: #DADCE0;
      --bg: #F8F9FA; --bg2: #F1F3F4; --card: #fff;
      --sh1: 0 1px 3px rgba(60,64,67,.12),0 1px 2px rgba(60,64,67,.08);
      --sh2: 0 2px 8px rgba(60,64,67,.14),0 1px 3px rgba(60,64,67,.1);
      --sh3: 0 6px 20px rgba(60,64,67,.14),0 2px 6px rgba(60,64,67,.1);
      --sh4: 0 12px 36px rgba(60,64,67,.15),0 4px 10px rgba(60,64,67,.08);
      --r1: 8px; --r2: 12px; --r3: 16px; --r4: 24px;
      --ease: cubic-bezier(.4,0,.2,1);
      --spring: cubic-bezier(.34,1.56,.64,1);
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════
       LOGIN SCREEN
    ═══════════════════════════════════════ */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0F1B2D;
      overflow: hidden;
      position: relative;
    }

    .ls-bg {
      position: absolute; inset: 0; overflow: hidden;
      background: radial-gradient(ellipse 80% 60% at 20% 40%, #1B3A6B 0%, transparent 60%),
                  radial-gradient(ellipse 60% 50% at 80% 60%, #0D4F3C 0%, transparent 55%),
                  radial-gradient(ellipse 50% 40% at 50% 100%, #2D1B5E 0%, transparent 50%);
    }

    .ls-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .35;
      animation: orbFloat 7s ease-in-out infinite;
    }
    .ls-orb:nth-child(1) {
      width: 400px; height: 400px;
      background: radial-gradient(#1B73E8, #0D47A1);
      top: -120px; left: -100px;
      animation-delay: 0s;
    }
    .ls-orb:nth-child(2) {
      width: 300px; height: 300px;
      background: radial-gradient(#34A853, #1B5E20);
      bottom: -80px; right: 5%;
      animation-delay: 2.5s;
    }
    .ls-orb:nth-child(3) {
      width: 220px; height: 220px;
      background: radial-gradient(#8B5CF6, #4C1D95);
      top: 40%; right: 15%;
      animation-delay: 5s;
    }
    @keyframes orbFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(15px,-20px) scale(1.05); }
    }

    .ls-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .login-card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--r4);
      padding: 48px 44px 44px;
      width: 100%; max-width: 420px;
      box-shadow: 0 32px 80px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);
      animation: cardIn .6s var(--spring);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-top {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px; height: 76px;
      background: linear-gradient(135deg, #1B73E8 0%, #34A853 100%);
      border-radius: 22px;
      font-size: 2.2rem;
      margin-bottom: 20px;
      box-shadow: 0 8px 28px rgba(27,115,232,.45), 0 0 0 1px rgba(255,255,255,.12);
    }
    .login-brand {
      font-size: .72rem;
      font-weight: 700;
      color: rgba(255,255,255,.5);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .login-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.2;
    }
    .login-sub {
      font-size: .85rem;
      color: rgba(255,255,255,.5);
      margin-top: 7px;
    }

    .login-field {
      position: relative;
      margin-bottom: 14px;
    }
    .login-field-icon {
      position: absolute;
      left: 15px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,.35);
      font-size: 1rem;
      pointer-events: none;
    }
    .login-input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.12);
      border-radius: var(--r2);
      font-size: .95rem;
      font-family: inherit;
      color: #fff;
      outline: none;
      transition: all .2s var(--ease);
    }
    .login-input::placeholder { color: rgba(255,255,255,.3); }
    .login-input:focus {
      border-color: rgba(27,115,232,.8);
      background: rgba(27,115,232,.12);
      box-shadow: 0 0 0 4px rgba(27,115,232,.2);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1B73E8, #1557B0);
      color: #fff;
      border: none;
      border-radius: var(--r2);
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s var(--ease);
      box-shadow: 0 4px 16px rgba(27,115,232,.45);
      margin-top: 4px;
      position: relative;
      overflow: hidden;
    }
    .login-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(27,115,232,.55); }
    .login-btn:active { transform: translateY(0); }

    .login-err {
      min-height: 22px;
      font-size: .8rem;
      color: #F28B82;
      text-align: center;
      margin-top: 10px;
      font-weight: 500;
    }
    .login-hint {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 24px;
      padding: 13px 15px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--r1);
      font-size: .78rem;
      color: rgba(255,255,255,.4);
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%      { transform: translateX(-9px); }
      35%      { transform: translateX(7px); }
      55%      { transform: translateX(-5px); }
      75%      { transform: translateX(4px); }
    }
    .shake { animation: shake .45s var(--ease); }

    /* ═══════════════════════════════════════
       APP LAYOUT
    ═══════════════════════════════════════ */
    #app { display: none; flex-direction: column; min-height: 100vh; }

    /* Header */
    .app-header {
      background: #fff;
      border-bottom: 1px solid var(--b1);
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 1px 4px rgba(60,64,67,.08);
    }
    .header-inner {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 24px;
      gap: 8px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin-right: 8px;
    }
    .h-logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #1B73E8, #34A853);
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(27,115,232,.3);
    }
    .h-name {
      font-size: .95rem;
      font-weight: 800;
      color: var(--t1);
      white-space: nowrap;
    }
    .h-name em { color: var(--p); font-style: normal; }

    .h-divider { width: 1px; height: 28px; background: var(--b1); flex-shrink: 0; margin: 0 8px; }

    /* Nav */
    .h-nav { display: flex; gap: 2px; }
    .nav-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border: none; background: transparent;
      font-size: .875rem; font-weight: 600; font-family: inherit;
      color: var(--t3);
      border-radius: 50px;
      cursor: pointer;
      transition: all .18s var(--ease);
      white-space: nowrap;
    }
    .nav-btn:hover { background: var(--bg2); color: var(--t1); }
    .nav-btn.active { background: var(--p-light); color: var(--p); }
    .nav-icon { font-size: .95rem; }

    .h-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    .role-chip {
      padding: 5px 12px;
      border-radius: 50px;
      font-size: .75rem; font-weight: 700;
      letter-spacing: .02em;
    }
    .role-chip.teacher { background: #E6F4EA; color: #1E8E3E; }
    .role-chip.admin   { background: var(--p-light); color: var(--p-dark); }

    .btn-logout {
      padding: 7px 16px;
      border: 1.5px solid var(--b2);
      border-radius: 50px;
      background: #fff;
      font-size: .78rem; font-weight: 600; font-family: inherit;
      color: var(--t3);
      cursor: pointer;
      transition: all .18s var(--ease);
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); background: #FDF2F2; }

    /* ═══════════════════════════════════════
       TAB PANES
    ═══════════════════════════════════════ */
    .app-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tab-pane { display: none; flex: 1; flex-direction: column; overflow: auto; }
    .tab-pane.active { display: flex; }

    /* ═══════════════════════════════════════
       CALENDAR TAB
    ═══════════════════════════════════════ */
    .cal-wrap {
      flex: 1;
      padding: 28px 28px 32px;
    }

    /* FullCalendar overrides */
    .fc .fc-toolbar { margin-bottom: 20px; }
    .fc .fc-toolbar-title {
      font-size: 1.2rem; font-weight: 800; color: var(--t1);
    }
    .fc .fc-button {
      background: #fff !important;
      border: 1.5px solid var(--b2) !important;
      color: var(--t3) !important;
      border-radius: var(--r1) !important;
      font-family: inherit !important;
      font-weight: 600 !important;
      font-size: .82rem !important;
      padding: 6px 14px !important;
      box-shadow: none !important;
      transition: all .15s !important;
    }
    .fc .fc-button:hover {
      background: var(--bg2) !important;
      border-color: var(--p) !important;
      color: var(--p) !important;
    }
    .fc .fc-button-primary:not(:disabled).fc-button-active {
      background: var(--p-light) !important;
      border-color: var(--p) !important;
      color: var(--p) !important;
    }
    .fc .fc-col-header-cell-cushion {
      font-size: .78rem; font-weight: 700;
      color: var(--t3); text-decoration: none;
    }
    .fc .fc-daygrid-day-number {
      font-size: .82rem; font-weight: 600;
      color: var(--t2); text-decoration: none;
      padding: 6px 8px;
    }
    .fc .fc-day-today .fc-daygrid-day-number {
      background: var(--p);
      color: #fff;
      border-radius: 50%;
      width: 28px; height: 28px;
      display: inline-flex;
      align-items: center; justify-content: center;
      padding: 0;
      margin: 4px;
    }
    .fc .fc-daygrid-day.fc-day-today { background: #F0F7FF; }
    .fc .fc-event {
      border-radius: 6px !important;
      border: none !important;
      font-size: .74rem !important;
      font-weight: 700 !important;
      padding: 2px 7px !important;
      cursor: pointer !important;
      transition: filter .15s !important;
    }
    .fc .fc-event:hover { filter: brightness(.92) !important; }
    .fc-theme-standard .fc-scrollgrid {
      border-radius: var(--r2);
      overflow: hidden;
      box-shadow: var(--sh1);
    }
    .fc-theme-standard td, .fc-theme-standard th {
      border-color: var(--b1) !important;
    }
    .fc .fc-daygrid-day { min-height: 96px; }

    /* ═══════════════════════════════════════
       CARDS TAB
    ═══════════════════════════════════════ */
    .cards-bar {
      padding: 20px 28px 0;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .filter-chips { display: flex; gap: 7px; flex-wrap: wrap; }
    .f-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 16px;
      border: 1.5px solid var(--b2);
      border-radius: 50px;
      background: #fff;
      font-size: .82rem; font-weight: 600; font-family: inherit;
      color: var(--t3);
      cursor: pointer;
      transition: all .18s var(--ease);
    }
    .f-chip:hover { border-color: var(--p); color: var(--p); }
    .f-chip.active {
      background: var(--p); border-color: var(--p);
      color: #fff;
      box-shadow: 0 2px 10px rgba(27,115,232,.3);
    }
    .f-chip-count {
      background: rgba(255,255,255,.25);
      padding: 1px 6px;
      border-radius: 50px;
      font-size: .7rem; font-weight: 800;
    }
    .f-chip:not(.active) .f-chip-count {
      background: var(--bg2);
      color: var(--t4);
    }
    .cards-total {
      margin-left: auto;
      font-size: .82rem; color: var(--t3); font-weight: 500;
    }

    .cards-grid {
      padding: 20px 28px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(282px, 1fr));
      gap: 14px;
      align-items: start;
    }

    /* Card */
    .s-card {
      border-radius: var(--r3);
      overflow: hidden;
      cursor: pointer;
      transition: all .22s var(--ease);
      box-shadow: 0 1px 4px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.06);
      animation: cIn .35s var(--spring);
      animation-fill-mode: backwards;
    }
    @keyframes cIn {
      from { opacity:0; transform: translateY(14px) scale(.96); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }
    .s-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 32px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04);
    }

    .card-head {
      padding: 18px 18px 14px;
    }
    .card-top-row {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-bottom: 12px;
    }
    .card-title {
      font-size: .93rem; font-weight: 800; color: var(--t1);
      line-height: 1.4; flex: 1;
    }
    .s-pill {
      padding: 3px 10px;
      border-radius: 50px;
      font-size: .68rem; font-weight: 800;
      white-space: nowrap; flex-shrink: 0;
      letter-spacing: .02em;
    }
    .sp-pending  { background: rgba(249,171,0,.15); color: #B45309; }
    .sp-approved { background: rgba(30,142,62,.12);  color: #1E8E3E; }
    .sp-rejected { background: rgba(217,48,37,.1);   color: #D93025; }

    .card-instructor-row {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,.06);
      padding: 5px 12px 5px 8px;
      border-radius: 50px;
      font-size: .78rem; font-weight: 700;
      color: rgba(0,0,0,.65);
      margin-bottom: 12px;
    }
    .ci-avatar {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,.18);
      display: flex; align-items: center; justify-content: center;
      font-size: .62rem; font-weight: 900; color: rgba(0,0,0,.7);
      flex-shrink: 0;
    }

    .card-info { display: flex; flex-direction: column; gap: 5px; }
    .ci-row {
      display: flex; align-items: center; gap: 7px;
      font-size: .78rem; color: rgba(0,0,0,.55);
    }
    .ci-icon { width: 15px; text-align: center; font-size: .8rem; flex-shrink: 0; }

    .card-foot {
      padding: 10px 16px 12px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      background: rgba(0,0,0,.05);
      border-top: 1px solid rgba(0,0,0,.06);
    }
    .card-cap {
      display: flex; align-items: center; gap: 5px;
      font-size: .75rem; font-weight: 700; color: rgba(0,0,0,.5);
    }
    .card-btns { display: flex; gap: 5px; }
    .c-btn {
      padding: 5px 12px;
      border-radius: 50px;
      border: 1.5px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.6);
      font-size: .72rem; font-weight: 700; font-family: inherit;
      cursor: pointer;
      transition: all .15s var(--ease);
      color: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
    }
    .c-btn:hover { background: rgba(255,255,255,.9); box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    .c-btn-approve:hover { color: var(--green); border-color: rgba(30,142,62,.3); background: rgba(30,142,62,.08); }
    .c-btn-reject:hover  { color: var(--red);   border-color: rgba(217,48,37,.3);  background: rgba(217,48,37,.08); }
    .c-btn-edit:hover    { color: var(--p);      border-color: rgba(27,115,232,.3); background: rgba(27,115,232,.08); }
    .c-btn-del:hover     { color: var(--red);    border-color: rgba(217,48,37,.3);  background: rgba(217,48,37,.08); }

    .cards-empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 72px 24px;
    }
    .ce-icon { font-size: 3.5rem; margin-bottom: 18px; opacity: .6; }
    .ce-title { font-size: 1.05rem; font-weight: 700; color: var(--t2); margin-bottom: 8px; }
    .ce-sub { font-size: .875rem; color: var(--t4); }

    /* ═══════════════════════════════════════
       SUBMIT TAB
    ═══════════════════════════════════════ */
    .submit-outer {
      flex: 1;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 32px 24px 48px;
    }
    .submit-card {
      background: #fff;
      border-radius: var(--r4);
      border: 1px solid var(--b1);
      padding: 44px 48px;
      width: 100%; max-width: 700px;
      box-shadow: var(--sh1);
    }
    .sc-header { margin-bottom: 36px; }
    .sc-eyebrow {
      font-size: .72rem; font-weight: 800;
      color: var(--p); letter-spacing: .1em;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .sc-title {
      font-size: 1.5rem; font-weight: 900; color: var(--t1);
      margin-bottom: 6px; line-height: 1.2;
    }
    .sc-sub { font-size: .875rem; color: var(--t3); }
    .sc-line {
      height: 4px; width: 52px;
      background: linear-gradient(90deg, var(--p), #34A853);
      border-radius: 99px; margin-top: 16px;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; }
    .span2 { grid-column: 1/-1; }
    .fg { display: flex; flex-direction: column; gap: 6px; }
    .fl {
      font-size: .78rem; font-weight: 800;
      color: var(--t2); letter-spacing: .03em;
    }
    .fl .req { color: var(--red); }
    .fi, .fs, .fta {
      padding: 11px 14px;
      border: 1.5px solid var(--b2);
      border-radius: var(--r1);
      font-size: .9rem; font-family: inherit; color: var(--t1);
      background: var(--bg);
      outline: none;
      transition: all .18s var(--ease);
    }
    .fi:focus, .fs:focus, .fta:focus {
      border-color: var(--p);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(27,115,232,.1);
    }
    .fta { min-height: 88px; resize: vertical; line-height: 1.6; }
    .time-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
    .time-sep { font-size: .9rem; color: var(--t3); font-weight: 700; text-align: center; }

    .form-foot {
      margin-top: 36px;
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 24px;
      border-top: 1px solid var(--b1);
      flex-wrap: wrap; gap: 12px;
    }
    .form-foot-note { font-size: .78rem; color: var(--t4); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 11px 24px;
      border-radius: 50px; border: none;
      font-size: .9rem; font-weight: 700; font-family: inherit;
      cursor: pointer;
      transition: all .18s var(--ease);
    }
    .btn-p {
      background: linear-gradient(135deg, #1B73E8, #1557B0);
      color: #fff;
      box-shadow: 0 4px 14px rgba(27,115,232,.35);
    }
    .btn-p:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(27,115,232,.45); }
    .btn-p:active { transform: translateY(0); }
    .btn-p:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn-s {
      background: #fff;
      color: var(--t2);
      border: 1.5px solid var(--b2);
    }
    .btn-s:hover { background: var(--bg2); border-color: var(--t4); }

    /* ═══════════════════════════════════════
       MODAL
    ═══════════════════════════════════════ */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(32,33,36,.55);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: var(--r4);
      padding: 32px;
      width: 100%; max-width: 540px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--sh4);
      animation: mIn .28s var(--spring);
    }
    @keyframes mIn {
      from { opacity:0; transform: translateY(24px) scale(.94); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }
    .modal-sm { max-width: 420px; }

    .m-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 24px; }
    .m-icon {
      width: 50px; height: 50px;
      border-radius: var(--r2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; flex-shrink: 0;
    }
    .m-icon-blue  { background: var(--p-light); }
    .m-icon-red   { background: #FDECEA; }
    .m-title { font-size: 1.15rem; font-weight: 800; color: var(--t1); margin-bottom: 3px; }
    .m-sub { font-size: .85rem; color: var(--t3); }
    .m-close {
      margin-left: auto; background: none; border: none;
      cursor: pointer; color: var(--t4);
      font-size: 1.15rem; padding: 6px;
      border-radius: var(--r1);
      transition: all .15s var(--ease);
      flex-shrink: 0; line-height: 1;
    }
    .m-close:hover { background: var(--bg2); color: var(--t1); }

    /* Detail content */
    .d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .d-item {}
    .d-label {
      font-size: .7rem; font-weight: 800;
      color: var(--t4); text-transform: uppercase;
      letter-spacing: .08em; margin-bottom: 4px;
    }
    .d-val { font-size: .9rem; color: var(--t1); font-weight: 500; line-height: 1.5; }
    .d-divider { height: 1px; background: var(--b1); margin: 18px 0; }

    .m-actions {
      display: flex; gap: 9px; justify-content: flex-end;
      margin-top: 24px; padding-top: 20px;
      border-top: 1px solid var(--b1);
      flex-wrap: wrap;
    }

    .m-btn {
      padding: 9px 18px;
      border-radius: 50px;
      border: none;
      font-size: .84rem; font-weight: 700; font-family: inherit;
      cursor: pointer;
      transition: all .15s var(--ease);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .mb-approve { background: #E6F4EA; color: var(--green); }
    .mb-approve:hover { background: #C7E6CE; }
    .mb-reject  { background: #FDECEA; color: var(--red); }
    .mb-reject:hover  { background: #FAD2D0; }
    .mb-edit    { background: var(--p-light); color: var(--p); }
    .mb-edit:hover    { background: #D2E3FC; }
    .mb-del     { background: #FDECEA; color: var(--red); }
    .mb-del:hover     { background: #FAD2D0; }
    .mb-close   { background: var(--bg2); color: var(--t2); }
    .mb-close:hover   { background: var(--b1); }
    .mb-confirm-del   { background: var(--red); color: #fff; box-shadow: 0 3px 10px rgba(217,48,37,.3); }
    .mb-confirm-del:hover { background: #C62828; }

    /* ═══════════════════════════════════════
       TOAST
    ═══════════════════════════════════════ */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--t1); color: #fff;
      padding: 12px 24px; border-radius: 50px;
      font-size: .875rem; font-weight: 600;
      z-index: 300; opacity: 0;
      transition: all .3s var(--spring);
      pointer-events: none;
      white-space: nowrap;
      box-shadow: var(--sh4);
      display: flex; align-items: center; gap: 8px;
    }
    .toast.show { opacity:1; transform: translateX(-50%) translateY(0); }
    .toast.t-ok  { background: #1E8E3E; }
    .toast.t-err { background: var(--red); }

    /* ═══════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════ */
    @media (max-width: 860px) {
      .h-name { display: none; }
      .h-divider { display: none; }
      .cards-grid { padding: 16px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
      .form-grid { grid-template-columns: 1fr; }
      .span2 { grid-column: 1; }
      .submit-card { padding: 28px 24px; }
      .d-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .header-inner { padding: 0 14px; }
      .nav-btn { padding: 7px 11px; font-size: .8rem; }
      .nav-btn span:not(.nav-icon) { display: none; }
      .cal-wrap { padding: 14px; }
      .cards-bar { padding: 14px 14px 0; }
      .cards-grid { padding: 14px; grid-template-columns: 1fr; }
      .submit-outer { padding: 16px; }
      .submit-card { padding: 22px 18px; }
      .modal { padding: 22px 18px; border-radius: var(--r3); }
    }
  </style>
</head>

<script>
// ══════════════════════════════════════
// CONFIG
// ══════════════════════════════════════
const PW_MAP = { 'sbs2025': 'teacher', 'admin0000': 'admin' };

firebase.initializeApp({
  apiKey: "AIzaSyBcrvuu9cMpCxdvsR_PqrktHWXK5e6dpFc",
  authDomain: "sbscheonans.firebaseapp.com",
  projectId: "sbscheonans",
  storageBucket: "sbscheonans.firebasestorage.app",
  messagingSenderId: "901448586994",
  appId: "1:901448586994:web:725325cb2ab3b3b870e26b"
});
const db = firebase.firestore();

const COLORS = [
  '#FAAFA8','#F39F76','#FFF8B8','#E2F6D3',
  '#B4DDD3','#D4E4ED','#AECCDC','#F6E2DD',
  '#E9E3D4','#D3BFDB','#CBE4F9','#A8DAB5',
];

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let role       = null;
let seminars   = [];
let cal        = null;
let curFilter  = 'all';
let delId      = null;
let activeTab  = 'calendar';

// ══════════════════════════════════════
// AUTH
// ══════════════════════════════════════
function doLogin() {
  const pw = document.getElementById('pw-input').value.trim();
  const r  = PW_MAP[pw];
  const errEl = document.getElementById('pw-err');
  if (!r) {
    errEl.textContent = '비밀번호가 올바르지 않습니다.';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
    const card = document.querySelector('.login-card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    return;
  }
  errEl.textContent = '';
  role = r;
  sessionStorage.setItem('semRole', r);
  showApp();
}

function doLogout() {
  sessionStorage.removeItem('semRole');
  role = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-err').textContent = '';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const chip = document.getElementById('role-chip');
  chip.textContent = role === 'admin' ? '관리자' : '선생님';
  chip.className = `role-chip ${role}`;
  loadData();
}

window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('semRole');
  if (saved === 'teacher' || saved === 'admin') { role = saved; showApp(); }
});

// ══════════════════════════════════════
// DATA
// ══════════════════════════════════════
function loadData() {
  db.collection('seminars').orderBy('createdAt', 'desc').onSnapshot(snap => {
    seminars = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCards();
    syncCalendar();
    updateCounts();
  });
}

// ══════════════════════════════════════
// CALENDAR
// ══════════════════════════════════════
function syncCalendar() {
  const visible = seminars.filter(s =>
    s.status === 'approved' || (role === 'admin' && s.status === 'pending')
  );
  const events = visible.map(s => {
    const c = cardColor(s.id);
    const isPending = s.status === 'pending';
    return {
      id: s.id,
      title: `${s.instructor ? s.instructor.replace(' 강사','') + ' · ' : ''}${s.title}`,
      start: s.event_date + 'T' + (s.start_time || '09:00'),
      end:   s.event_date + 'T' + (s.end_time   || '10:00'),
      backgroundColor: isPending ? '#FEF3C7' : c,
      borderColor:     isPending ? '#F9AB00'  : c,
      textColor:       isPending ? '#B45309' : contrastColor(c),
      extendedProps: { id: s.id }
    };
  });

  if (cal) { cal.removeAllEvents(); cal.addEventSource(events); return; }

  const el = document.getElementById('fc-cal');
  if (!el) return;
  cal = new FullCalendar.Calendar(el, {
    initialView: 'dayGridMonth',
    locale: 'ko',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,dayGridWeek' },
    buttonText: { today: '오늘', month: '월간', week: '주간' },
    events,
    eventClick: info => openDetail(info.event.extendedProps.id),
    height: 'auto',
    fixedWeekCount: false,
    dayMaxEvents: 3,
  });
  cal.render();
}

// ══════════════════════════════════════
// CARDS
// ══════════════════════════════════════
function updateCounts() {
  const byStatus = s => seminars.filter(x => x.status === s).length;
  document.getElementById('cnt-all').textContent     = seminars.length;
  document.getElementById('cnt-pending').textContent  = byStatus('pending');
  document.getElementById('cnt-approved').textContent = byStatus('approved');
  document.getElementById('cnt-rejected').textContent = byStatus('rejected');
}

function setFilter(f) {
  curFilter = f;
  document.querySelectorAll('.f-chip').forEach(c => c.classList.toggle('active', c.dataset.f === f));
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  if (!grid) return;
  let list = curFilter === 'all' ? seminars : seminars.filter(s => s.status === curFilter);
  document.getElementById('cards-total').textContent = `총 ${list.length}건`;

  if (!list.length) {
    grid.innerHTML = `<div class="cards-empty">
      <div class="ce-icon">🔍</div>
      <div class="ce-title">${curFilter === 'all' ? '등록된 특강이 없습니다' : '해당 항목이 없습니다'}</div>
      <div class="ce-sub">제출하기 탭에서 특강을 등록해보세요!</div>
    </div>`;
    return;
  }

  grid.innerHTML = list.map((s, i) => makeCard(s, i)).join('');
}

function makeCard(s, i) {
  const c = cardColor(s.id);
  const statusLabel = { pending: '⏳ 검토중', approved: '✅ 확정', rejected: '❌ 반려' }[s.status] || s.status;
  const statusCls   = { pending: 'sp-pending', approved: 'sp-approved', rejected: 'sp-rejected' }[s.status] || '';
  const dateStr = s.event_date ? fmtDate(s.event_date) : '날짜 미정';
  const timeStr = (s.start_time && s.end_time) ? `${s.start_time} ~ ${s.end_time}` : '';
  const abbr = (s.instructor || '?').slice(0, 1);

  let btns = '';
  if (role === 'admin' && s.status === 'pending') {
    btns += `<button class="c-btn c-btn-approve" onclick="event.stopPropagation();doApprove('${s.id}')">승인</button>`;
    btns += `<button class="c-btn c-btn-reject"  onclick="event.stopPropagation();doReject('${s.id}')">반려</button>`;
  }
  btns += `<button class="c-btn c-btn-edit" onclick="event.stopPropagation();openEdit('${s.id}')">수정</button>`;
  if (role === 'admin')
    btns += `<button class="c-btn c-btn-del" onclick="event.stopPropagation();openDel('${s.id}')">🗑</button>`;

  return `<div class="s-card" style="animation-delay:${i * 40}ms;background:${c}" onclick="openDetail('${s.id}')">
    <div class="card-head">
      <div class="card-top-row">
        <div class="card-title">${esc(s.title)}</div>
        <span class="s-pill ${statusCls}">${statusLabel}</span>
      </div>
      <div class="card-instructor-row">
        <span class="ci-avatar">${abbr}</span>
        ${esc(s.instructor)}
      </div>
      <div class="card-info">
        <div class="ci-row"><span class="ci-icon">📅</span>${dateStr}${timeStr ? ' · ' + timeStr : ''}</div>
        <div class="ci-row"><span class="ci-icon">📍</span>${esc(s.location)}</div>
        ${s.target ? `<div class="ci-row"><span class="ci-icon">🎯</span>${esc(s.target)}</div>` : ''}
      </div>
    </div>
    <div class="card-foot">
      <div class="card-cap">👥 ${s.capacity}명</div>
      <div class="card-btns">${btns}</div>
    </div>
  </div>`;
}

// ══════════════════════════════════════
// DETAIL MODAL
// ══════════════════════════════════════
function openDetail(id) {
  const s = seminars.find(x => x.id === id);
  if (!s) return;
  const c = cardColor(s.id);
  const statusLabel = { pending: '⏳ 검토중', approved: '✅ 확정', rejected: '❌ 반려' }[s.status];
  const statusCls   = { pending: 'sp-pending', approved: 'sp-approved', rejected: 'sp-rejected' }[s.status];
  const dateStr = s.event_date ? fmtDate(s.event_date) : '-';
  const timeStr = (s.start_time && s.end_time) ? `${s.start_time} ~ ${s.end_time}` : '-';

  document.getElementById('d-icon').style.background = c;
  document.getElementById('d-icon').style.fontSize = '1.4rem';
  document.getElementById('d-title').textContent = s.title;
  document.getElementById('d-status-wrap').innerHTML = `<span class="s-pill ${statusCls}">${statusLabel}</span>`;

  document.getElementById('d-content').innerHTML = `
    <div class="d-grid">
      <div class="d-item"><div class="d-label">강사</div><div class="d-val">${esc(s.instructor)}</div></div>
      <div class="d-item"><div class="d-label">강의장</div><div class="d-val">${esc(s.location)}</div></div>
      <div class="d-item"><div class="d-label">날짜</div><div class="d-val">${dateStr}</div></div>
      <div class="d-item"><div class="d-label">시간</div><div class="d-val">${timeStr}</div></div>
      <div class="d-item"><div class="d-label">정원</div><div class="d-val">${s.capacity}명</div></div>
      <div class="d-item"><div class="d-label">대상</div><div class="d-val">${esc(s.target || '-')}</div></div>
    </div>
    ${s.registration ? `<div class="d-divider"></div>
      <div class="d-item"><div class="d-label">신청 방법</div><div class="d-val">${esc(s.registration)}</div></div>` : ''}
    ${s.memo ? `<div class="d-divider"></div>
      <div class="d-item"><div class="d-label">추가 메모</div><div class="d-val" style="white-space:pre-wrap">${esc(s.memo)}</div></div>` : ''}
  `;

  let acts = '';
  if (role === 'admin' && s.status === 'pending') {
    acts += `<button class="m-btn mb-approve" onclick="doApprove('${s.id}');closeDetail()">✅ 승인</button>`;
    acts += `<button class="m-btn mb-reject"  onclick="doReject('${s.id}');closeDetail()">❌ 반려</button>`;
  }
  acts += `<button class="m-btn mb-edit" onclick="openEdit('${s.id}');closeDetail()">✏️ 수정</button>`;
  if (role === 'admin')
    acts += `<button class="m-btn mb-del" onclick="openDel('${s.id}');closeDetail()">🗑️ 삭제</button>`;
  acts += `<button class="m-btn mb-close" onclick="closeDetail()">닫기</button>`;

  document.getElementById('d-actions').innerHTML = acts;
  document.getElementById('detail-overlay').classList.add('show');
}
function closeDetail() { document.getElementById('detail-overlay').classList.remove('show'); }

// ══════════════════════════════════════
// SUBMIT / EDIT
// ══════════════════════════════════════
function switchTab(name) {
  activeTab = name;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'calendar' && cal) setTimeout(() => cal.updateSize(), 60);
}

function openEdit(id) {
  const s = seminars.find(x => x.id === id);
  if (!s) return;
  document.getElementById('edit-id').value          = id;
  document.getElementById('f-title').value          = s.title || '';
  document.getElementById('f-instructor').value     = s.instructor || '';
  document.getElementById('f-location').value       = s.location || '';
  document.getElementById('f-date').value           = s.event_date || '';
  document.getElementById('f-start').value          = s.start_time || '';
  document.getElementById('f-end').value            = s.end_time || '';
  document.getElementById('f-capacity').value       = s.capacity || '';
  document.getElementById('f-registration').value   = s.registration || '';
  document.getElementById('f-target').value         = s.target || '';
  document.getElementById('f-memo').value           = s.memo || '';
  document.getElementById('sc-title').textContent   = '특강 제안서 수정';
  document.getElementById('submit-btn').innerHTML   = '<span>💾</span> 저장하기';
  switchTab('submit');
}

function resetForm() {
  document.getElementById('edit-id').value = '';
  ['f-title','f-instructor','f-location','f-date','f-start','f-end',
   'f-capacity','f-registration','f-target','f-memo'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('sc-title').textContent  = '특강 제안서 제출';
  document.getElementById('submit-btn').innerHTML  = '<span>📤</span> 제출하기';
}

async function doSubmit() {
  const v = id => document.getElementById(id).value.trim();
  const title = v('f-title'), instructor = v('f-instructor'), location = v('f-location'),
        date = v('f-date'), startTime = v('f-start'), endTime = v('f-end'),
        capacity = parseInt(v('f-capacity')), target = v('f-target'),
        registration = v('f-registration'), memo = v('f-memo'), editId = v('edit-id');

  if (!title || !instructor || !location || !date || !startTime || !endTime || !capacity || !target) {
    showToast('필수 항목을 모두 입력해 주세요.', 'err'); return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span> 처리중...';

  const data = { title, instructor, location, event_date: date, start_time: startTime,
                 end_time: endTime, capacity, registration, target, memo };
  try {
    if (editId) {
      await db.collection('seminars').doc(editId).update(data);
      showToast('수정되었습니다!', 'ok');
    } else {
      data.status = 'pending';
      data.createdAt = Date.now();
      await db.collection('seminars').add(data);
      showToast('제출 완료! 관리자 승인 후 캘린더에 표시됩니다.', 'ok');
    }
    resetForm();
    switchTab('cards');
  } catch(e) {
    showToast('오류가 발생했습니다. 다시 시도해 주세요.', 'err');
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = editId ? '<span>💾</span> 저장하기' : '<span>📤</span> 제출하기';
  }
}

// ══════════════════════════════════════
// APPROVE / REJECT
// ══════════════════════════════════════
async function doApprove(id) {
  if (role !== 'admin') return;
  await db.collection('seminars').doc(id).update({ status: 'approved' });
  showToast('승인되었습니다! 캘린더에 표시됩니다.', 'ok');
}
async function doReject(id) {
  if (role !== 'admin') return;
  await db.collection('seminars').doc(id).update({ status: 'rejected' });
  showToast('반려 처리되었습니다.', 'err');
}

// ══════════════════════════════════════
// DELETE
// ══════════════════════════════════════
function openDel(id)  { delId = id; document.getElementById('del-overlay').classList.add('show'); }
function closeDel()   { delId = null; document.getElementById('del-overlay').classList.remove('show'); }
async function confirmDel() {
  if (!delId || role !== 'admin') return;
  await db.collection('seminars').doc(delId).delete();
  closeDel();
  showToast('삭제되었습니다.', 'err');
}

// ══════════════════════════════════════
// UTILS
// ══════════════════════════════════════
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function cardColor(id) {
  if (!id) return COLORS[0];
  let h = 0;
  for (let i = 0; i < id.length; i++) h = id.charCodeAt(i) + ((h << 5) - h);
  return COLORS[Math.abs(h) % COLORS.length];
}
function contrastColor(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b)/255 > 0.6 ? '#202124' : '#fff';
}
function fmtDate(str) {
  const d = new Date(str + 'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

let toastT;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast${type ? ' t-' + type : ''}`;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 3200);
}
</script>
